name: Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/check_service_flow_site.py"
      - "scripts/check_tracked_secrets.py"
      - "web/service-flow/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package the static site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate the publication surface
        run: python -m scripts.check_service_flow_site

      - name: Check tracked files for secrets
        run: python -m scripts.check_tracked_secrets

      - name: Upload the exact static directory
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/service-flow
          retention-days: 1

  deploy:
    name: Deploy reviewed main to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy the static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
